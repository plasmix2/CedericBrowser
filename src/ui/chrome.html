<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --strip: #18191d; --toolbar: #26272c; --tab-hover: #222328; --fg: #ececf0; --dim: #9a9ca6;
    --faint: #5d606a; --field: #18191d; --field-hover: #1d1e22; --border: #34363d; --accent: #ff6a3d;
    --btn-hover: rgba(255,255,255,.08); --btn-press: rgba(255,255,255,.13); --close: #e81123;
    --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.4, .64, 1);
  }
  @media (prefers-color-scheme: light) {
    :root { --strip: #dfe1e6; --toolbar: #f7f7f9; --tab-hover: #e9eaee; --fg: #1d1e22; --dim: #5c5f68;
      --faint: #9fa2ab; --field: #e9eaee; --field-hover: #e2e3e8; --border: #d2d4da;
      --btn-hover: rgba(0,0,0,.06); --btn-press: rgba(0,0,0,.1); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--toolbar); color: var(--fg);
    font: 12.5px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; outline: none; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round; display: block; }

  /* ---------- title bar / tab strip ---------- */
  #titlebar { position: relative; display: flex; align-items: stretch; height: 40px; background: var(--strip); }
  #grip { position: absolute; inset: 0 0 auto 0; height: 4px; cursor: n-resize; z-index: 5; }
  #tabs { display: flex; align-items: flex-end; flex: 0 1 auto; min-width: 0; padding: 0 10px;
    overflow-x: auto; scrollbar-width: none; }
  #drag { flex: 1 1 0; min-width: 48px; display: flex; align-items: center; }

  .tab { position: relative; display: flex; align-items: center; gap: 8px; height: 33px;
    flex: 0 1 236px; min-width: 44px; padding: 0 6px 0 12px; border-radius: 9px 9px 0 0;
    color: var(--dim); overflow: hidden; contain: layout paint;
    transition: flex-basis .22s var(--ease), min-width .22s var(--ease), padding .22s var(--ease),
      opacity .18s var(--ease), background-color .15s, color .15s, transform .2s var(--ease); }
  .tab::after { content: ""; position: absolute; right: 0; top: 9px; bottom: 9px; width: 1px;
    background: var(--border); transition: opacity .15s; }
  .tab:hover { background: var(--tab-hover); color: var(--fg); }
  .tab:hover::after, .tab.active::after, .tab:has(+ .tab.active)::after,
  .tab:has(+ .tab:hover)::after { opacity: 0; }
  .tab.active { background: var(--toolbar); color: var(--fg); overflow: visible; z-index: 2; }
  /* curved "feet" joining the active tab to the toolbar */
  .tab.active::before, .tab.active .foot { content: ""; position: absolute; bottom: 0; width: 10px; height: 10px;
    background: radial-gradient(circle at 0 0, transparent 9.5px, var(--toolbar) 10px); }
  .tab.active::before { right: -10px; }
  .tab.active .foot { left: -10px; transform: scaleX(-1); }
  .tab.enter, .tab.leave { flex-basis: 0; min-width: 0; padding-left: 0; padding-right: 0; opacity: 0; }
  .tab.leave { pointer-events: none; }
  .tab.dragging { transition: background-color .15s, box-shadow .15s; z-index: 4; cursor: grabbing;
    box-shadow: 0 4px 14px rgba(0,0,0,.3); background: var(--toolbar); color: var(--fg); }
  .tab.dragging::after { opacity: 0; }

  .icon { position: relative; width: 16px; height: 16px; flex: none; }
  .icon img, .icon .globe, .icon .spin { position: absolute; inset: 0; width: 16px; height: 16px;
    transition: opacity .2s, transform .25s var(--spring); }
  .icon img { border-radius: 3px; }
  .icon .globe { color: var(--faint); }
  .icon .spin { border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent;
    animation: spin .65s linear infinite; opacity: 0; transform: scale(.4); }
  .tab.loading .spin { opacity: 1; transform: scale(1); }
  .tab.loading img, .tab.loading .globe, .tab:not(.has-icon) img, .tab.has-icon .globe { opacity: 0; transform: scale(.4); }
  @keyframes spin { to { rotate: 360deg; } }

  .tab .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap;
    mask-image: linear-gradient(90deg, #000 calc(100% - 22px), transparent); }
  .tab .x { flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    opacity: 0; transform: scale(.7); transition: opacity .15s, transform .2s var(--spring), background-color .12s; }
  .tab .x svg { width: 12px; height: 12px; stroke-width: 2.2; }
  .tab:hover .x, .tab.active .x { opacity: .75; transform: scale(1); }
  .tab .x:hover { opacity: 1; background: var(--btn-hover); }
  .tab .x:active { background: var(--btn-press); transform: scale(.88); }
  .tab.narrow:not(.active) .x { display: none; }

  #new { flex: none; width: 30px; height: 30px; margin: 0 4px; border-radius: 8px; display: grid; place-items: center;
    color: var(--dim); transition: background-color .12s, color .12s, transform .2s var(--spring); }
  #new:hover { background: var(--btn-hover); color: var(--fg); }
  #new:active { transform: scale(.88) rotate(90deg); }

  #winctl { display: flex; flex: none; }
  #winctl button { width: 46px; height: 100%; display: grid; place-items: center; color: var(--fg);
    transition: background-color .1s; }
  #winctl svg { width: 10px; height: 10px; stroke-width: 1.1; stroke-linecap: square; }
  #winctl button:hover { background: var(--btn-hover); }
  #winctl #wclose:hover { background: var(--close); color: #fff; }
  #winctl #wclose:active { background: #c50f1f; }

  /* ---------- toolbar ---------- */
  #toolbar { position: relative; display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px;
    background: var(--toolbar); border-bottom: 1px solid var(--border); }
  .btn { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none;
    transition: background-color .12s, opacity .2s, transform .18s var(--spring), color .15s; }
  .btn:hover:not(:disabled) { background: var(--btn-hover); }
  .btn:active:not(:disabled) { background: var(--btn-press); transform: scale(.88); }
  .btn:disabled { opacity: .3; }
  .btn.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #reload { position: relative; }
  #reload svg { position: absolute; transition: opacity .18s, transform .3s var(--spring); }
  #reload .stop { opacity: 0; transform: rotate(-90deg) scale(.5); }
  #reload.loading .stop { opacity: 1; transform: none; }
  #reload.loading .re { opacity: 0; transform: rotate(90deg) scale(.5); }
  #reload:not(.loading):active .re { transform: rotate(-120deg); }

  #omni { position: relative; flex: 1; height: 34px; margin: 0 8px; display: flex; align-items: center;
    border-radius: 17px; background: var(--field); border: 1px solid transparent;
    transition: background-color .15s, border-color .15s, box-shadow .25s var(--ease); }
  #omni:hover { background: var(--field-hover); }
  #omni.focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  #secure { flex: none; width: 34px; display: grid; place-items: center; color: var(--dim);
    transition: color .2s, transform .25s var(--spring); }
  #secure svg { width: 14px; height: 14px; }
  #secure.insecure { color: #f0a03c; }
  #omni.focus #secure { transform: scale(.9); }
  #addr, #pretty { position: absolute; inset: 0 14px 0 34px; height: 100%; font: 13.5px "Segoe UI Variable Text", "Segoe UI", system-ui; }
  #addr { width: calc(100% - 48px); border: 0; background: none; color: var(--fg); outline: none; user-select: text; opacity: 0; }
  #addr::placeholder { color: var(--faint); }
  #addr::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }
  #pretty { display: flex; align-items: center; white-space: nowrap; overflow: hidden; pointer-events: none;
    color: var(--dim); mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); }
  #pretty b { font-weight: 400; color: var(--fg); }
  #omni.focus #addr, #omni.empty #addr { opacity: 1; }
  #omni.focus #pretty, #omni.empty #pretty { opacity: 0; }

  #progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; transform-origin: 0 50%;
    transform: scaleX(0); opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, var(--accent), #ffb03d); box-shadow: 0 0 8px var(--accent); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
</style>
</head>
<body>
  <div id="titlebar">
    <div id="grip"></div>
    <div id="tabs"></div>
    <div id="drag">
      <button id="new" title="New tab (Ctrl+T)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div id="winctl">
      <button id="wmin" title="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
      <button id="wmax" title="Maximize"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
      <button id="wclose" title="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </div>
  <div id="toolbar">
    <button class="btn" id="back" title="Back (Alt+Left)" disabled><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
    <button class="btn" id="fwd" title="Forward (Alt+Right)" disabled><svg viewBox="0 0 24 24"><path d="M5 12h14M13 18l6-6-6-6"/></svg></button>
    <button class="btn" id="reload" title="Reload (Ctrl+R)">
      <svg class="re" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7L20 8.5"/><path d="M20 4v4.5h-4.5"/></svg>
      <svg class="stop" viewBox="0 0 24 24"><path d="M17 7L7 17M7 7l10 10"/></svg>
    </button>
    <div id="omni" class="empty">
      <span id="secure"></span>
      <div id="pretty"></div>
      <input id="addr" spellcheck="false" autocomplete="off" placeholder="Search or type a URL">
    </div>
    <button class="btn" id="hist" title="Search history (Ctrl+H)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
    <button class="btn" id="dev" title="Developer tools (F12)"><svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg></button>
    <div id="progress"></div>
  </div>
<script>
  const send = (o) => window.ipc.postMessage(JSON.stringify(o));
  const $ = (id) => document.getElementById(id);
  const tabsBox = $('tabs'), addr = $('addr'), omni = $('omni'), pretty = $('pretty'), bar = $('progress');
  const els = new Map();
  let state = null, editing = false, barOn = false;

  const ICONS = {
    globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
    x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>',
    search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
    max: '<svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg>',
    restore: '<svg viewBox="0 0 10 10"><rect x=".5" y="2.5" width="7" height="7"/><path d="M2.5 2.5V.5h7v7h-2"/></svg>',
  };

  // Animate a freshly inserted element from its "from" class to its resting state.
  const enter = (el) => { el.classList.add('enter'); el.offsetWidth; el.classList.remove('enter'); };

  function makeTab(t) {
    const el = document.createElement('div');
    el.className = 'tab';
    el.innerHTML = '<span class="foot"></span><span class="icon"><img alt=""><span class="globe">' + ICONS.globe +
      '</span><span class="spin"></span></span><span class="t"></span><button class="x" title="Close tab (Ctrl+W)">' + ICONS.x + '</button>';
    const img = el.querySelector('img');
    img.onerror = () => el.classList.remove('has-icon');
    img.onload = () => el.classList.add('has-icon');
    el.querySelector('.x').onclick = (e) => { e.stopPropagation(); closeTab(t.id); };
    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.x')) return;
      if (e.button === 1) { e.preventDefault(); closeTab(t.id); return; }
      if (e.button !== 0) return;
      send({ cmd: 'switch', id: t.id });
      drag = { el, id: t.id, startX: e.clientX, active: false };
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', onDragMove);
    el.addEventListener('pointerup', onDragEnd);
    el.addEventListener('pointercancel', onDragEnd);
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      send({ cmd: 'tab_menu', id: t.id, x: e.clientX, y: e.clientY });
    });
    return el;
  }

  // ---- drag to reorder: other tabs slide out of the way, the dragged one follows the pointer ----
  let drag = null;
  function onDragMove(e) {
    if (!drag) return;
    const dx = e.clientX - drag.startX;
    if (!drag.active) {
      if (Math.abs(dx) < 5) return;
      drag.active = true;
      drag.order = [...tabsBox.children].filter((c) => !c.classList.contains('leave'));
      drag.rects = drag.order.map((c) => c.getBoundingClientRect());
      drag.from = drag.to = drag.order.indexOf(drag.el);
      drag.el.classList.add('dragging');
    }
    const { order, rects, from, el } = drag;
    const me = rects[from], last = rects[rects.length - 1];
    const x = Math.max(rects[0].left - me.left, Math.min(last.right - me.right, dx));
    el.style.transform = `translateX(${x}px)`;
    const center = me.left + me.width / 2 + x;
    let to = 0;
    rects.forEach((r, j) => { if (j !== from && r.left + r.width / 2 < center) to++; });
    if (to === drag.to) return;
    drag.to = to;
    order.forEach((c, j) => {
      if (j === from) return;
      const shift = from < to && j > from && j <= to ? -me.width : from > to && j >= to && j < from ? me.width : 0;
      c.style.transform = shift ? `translateX(${shift}px)` : '';
    });
  }
  function onDragEnd() {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.active) return;
    const before = d.el.getBoundingClientRect().left;
    for (const c of d.order) { c.style.transition = 'none'; c.style.transform = ''; }
    const rest = d.order.filter((c) => c !== d.el);
    tabsBox.insertBefore(d.el, rest[d.to] || null);
    const after = d.el.getBoundingClientRect().left;
    d.el.style.transform = `translateX(${before - after}px)`;
    d.el.offsetWidth;
    for (const c of d.order) c.style.transition = '';
    d.el.classList.remove('dragging');
    d.el.style.transform = '';
    if (d.to !== d.from) send({ cmd: 'move_tab', id: d.id, to: d.to });
  }

  function removeTab(id) {
    const el = els.get(id);
    if (!el) return;
    els.delete(id);
    el.classList.add('leave');
    el.addEventListener('transitionend', () => el.remove(), { once: true });
    setTimeout(() => el.remove(), 300);
  }
  // Collapse the tab right away; the browser confirms with the next render.
  function closeTab(id) { removeTab(id); send({ cmd: 'close_tab', id }); }

  function updateTab(el, t, active) {
    el.classList.toggle('active', active);
    el.classList.toggle('loading', t.loading);
    el.title = t.title;
    const title = el.querySelector('.t');
    const text = t.title || 'New Tab';
    if (title.textContent !== text) title.textContent = text;
    const img = el.querySelector('img');
    if (t.favicon && img.getAttribute('src') !== t.favicon) img.src = t.favicon;
    if (!t.favicon && img.hasAttribute('src')) { img.removeAttribute('src'); el.classList.remove('has-icon'); }
  }

  function setProgress(on) {
    if (on === barOn) return;
    barOn = on;
    const s = bar.style;
    if (on) {
      s.transition = 'none'; s.transform = 'scaleX(0)'; s.opacity = '1'; bar.offsetWidth;
      s.transition = 'transform 8s cubic-bezier(.08,.82,.17,1)'; s.transform = 'scaleX(.9)';
    } else {
      s.transition = 'transform .2s var(--ease), opacity .35s .15s'; s.transform = 'scaleX(1)'; s.opacity = '0';
    }
  }

  function prettyUrl(url) {
    pretty.textContent = '';
    if (!url) return;
    const m = url.match(/^(https?:\/\/)(?:www\.)?([^/?#]+)(.*)$/);
    if (!m) { pretty.textContent = url; return; }
    const host = document.createElement('b');
    host.textContent = m[2];
    const rest = m[3] === '/' ? '' : m[3];
    pretty.append(m[1] === 'http://' ? 'http://' : '', host, rest);
  }

  function setSecure(url) {
    const https = url.startsWith('https://'), http = url.startsWith('http://');
    const sec = $('secure');
    sec.innerHTML = https ? ICONS.lock : http ? ICONS.info : ICONS.search;
    sec.className = http ? 'insecure' : '';
    sec.title = https ? 'Connection is secure' : http ? 'Connection is not secure' : '';
  }

  window.render = (s) => {
    const switched = !state || state.active !== s.active;
    state = s;
    const ids = new Set(s.tabs.map((t) => t.id));
    for (const id of [...els.keys()]) if (!ids.has(id)) removeTab(id);

    let prev = null;
    for (const t of s.tabs) {
      let el = els.get(t.id);
      const fresh = !el;
      if (fresh) { el = makeTab(t); els.set(t.id, el); }
      const want = prev ? prev.nextSibling : tabsBox.firstChild;
      if (want !== el && !(drag && drag.active)) tabsBox.insertBefore(el, want);
      updateTab(el, t, t.id === s.active);
      if (fresh) enter(el);
      prev = el;
    }
    const narrow = tabsBox.clientWidth / Math.max(1, s.tabs.length) < 90;
    for (const el of els.values()) el.classList.toggle('narrow', narrow);

    if (!editing || switched) addr.value = s.url;
    omni.classList.toggle('empty', !s.url);
    prettyUrl(s.url);
    setSecure(s.url);
    $('back').disabled = !s.can_back;
    $('fwd').disabled = !s.can_forward;
    $('reload').classList.toggle('loading', s.loading);
    $('reload').title = s.loading ? 'Stop loading' : 'Reload (Ctrl+R)';
    if (switched) { barOn = !s.loading; }
    setProgress(s.loading);
    $('dev').classList.toggle('on', !!s.devtools);
    $('wmax').innerHTML = s.maximized ? ICONS.restore : ICONS.max;
    $('wmax').title = s.maximized ? 'Restore' : 'Maximize';
  };
  window.focusAddress = () => { addr.focus(); addr.select(); };
  window.blurAddress = () => addr.blur();
  window.openHistory = () => {
    const r = $('hist').getBoundingClientRect();
    send({ cmd: 'history_menu', x: r.right, y: r.bottom + 4 });
  };

  addr.addEventListener('focus', () => { editing = true; omni.classList.add('focus'); requestAnimationFrame(() => addr.select()); });
  addr.addEventListener('blur', () => {
    editing = false; omni.classList.remove('focus'); if (state) addr.value = state.url;
    sugg = []; send({ cmd: 'suggest_close' });
  });

  // ---- suggestions: Rust fetches them and draws the dropdown; arrows pick one here ----
  let sugg = [], sIdx = 0, typed = '';
  window.setSuggestions = (items) => { sugg = items; sIdx = 0; };
  addr.addEventListener('input', () => {
    typed = addr.value;
    const r = omni.getBoundingClientRect();
    send({ cmd: 'query', text: addr.value, x: r.left, y: r.bottom + 4, w: r.width });
  });
  addr.addEventListener('keydown', (e) => {
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && sugg.length) {
      e.preventDefault();
      const n = sugg.length;
      sIdx = (sIdx + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
      addr.value = sIdx === 0 ? typed : sugg[sIdx].text;
      send({ cmd: 'suggest_select', index: sIdx });
    } else if (e.key === 'Enter' && addr.value.trim()) {
      send({ cmd: 'navigate', input: addr.value }); sugg = []; addr.blur();
    } else if (e.key === 'Escape') {
      if (sugg.length) { sugg = []; addr.value = typed; send({ cmd: 'suggest_close' }); } else addr.blur();
    }
  });
  omni.addEventListener('mousedown', (e) => { if (e.target !== addr) { e.preventDefault(); addr.focus(); } });

  $('new').onclick = () => send({ cmd: 'new_tab' });
  $('back').onclick = () => send({ cmd: 'back' });
  $('fwd').onclick = () => send({ cmd: 'forward' });
  $('reload').onclick = () => send({ cmd: state && state.loading ? 'stop' : 'reload' });
  $('hist').onclick = () => window.openHistory();
  $('dev').onclick = () => send({ cmd: 'devtools' });
  $('wmin').onclick = () => send({ cmd: 'minimize' });
  $('wmax').onclick = () => send({ cmd: 'maximize' });
  $('wclose').onclick = () => send({ cmd: 'close_window' });
  $('grip').onmousedown = (e) => { if (e.button === 0) { e.preventDefault(); send({ cmd: 'resize_top' }); } };

  // Empty title-bar space moves the window; a double-click toggles maximize.
  const isDragArea = (t) => t === tabsBox || t === $('drag') || t === $('titlebar');
  $('titlebar').addEventListener('mousedown', (e) => {
    if (e.button !== 0 || !isDragArea(e.target)) return;
    send({ cmd: e.detail === 2 ? 'maximize' : 'drag' });
  });
  tabsBox.addEventListener('wheel', (e) => { tabsBox.scrollLeft += e.deltaY; }, { passive: true });

  window.addEventListener('keydown', (e) => {
    const c = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    let cmd = null;
    if (c && k === 't') cmd = { cmd: 'new_tab' };
    else if (c && k === 'w' && state) { e.preventDefault(); closeTab(state.active); return; }
    else if (c && k === 'l') { e.preventDefault(); window.focusAddress(); return; }
    else if (c && k === 'h') { e.preventDefault(); window.openHistory(); return; }
    else if ((c && k === 'r') || e.key === 'F5') cmd = { cmd: 'reload' };
    else if (e.key === 'F12' || (c && e.shiftKey && k === 'i')) cmd = { cmd: 'devtools' };
    if (cmd) { e.preventDefault(); send(cmd); }
  });
  document.addEventListener('contextmenu', (e) => { if (e.target !== addr) e.preventDefault(); });
  send({ cmd: 'ready' });
</script>
</body>
</html>
