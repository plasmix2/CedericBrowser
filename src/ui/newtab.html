<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  :root { --bg: #1d1e22; --fg: #ececf0; --dim: #8d909a; --field: #2a2b31; --border: #383a42; --accent: #ff6a3d;
    --ease: cubic-bezier(.2, .8, .2, 1); }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f4f6; --fg: #1d1e22; --dim: #6b6f78; --field: #fff; --border: #d4d6dc; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 15px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body::before { content: ""; position: fixed; inset: -20%; pointer-events: none; opacity: .55;
    background: radial-gradient(40% 35% at 30% 20%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
      radial-gradient(35% 30% at 75% 75%, rgba(120, 90, 255, .18), transparent 70%);
    animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(4%, -3%) scale(1.08); } }
  main { position: relative; min-height: 100%; display: grid; place-content: center; justify-items: center;
    gap: 28px; padding: 16px; text-align: center; }
  main > * { animation: rise .55s var(--ease) both; }
  main > :nth-child(2) { animation-delay: .06s; }
  main > :nth-child(3) { animation-delay: .12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  h1 { margin: 0; font: 650 48px "Segoe UI Variable Display", "Segoe UI", system-ui; letter-spacing: -1.5px; }
  h1 span { color: var(--accent); }
  form { position: relative; width: min(640px, calc(100vw - 32px)); }
  form svg { position: absolute; left: 20px; top: 50%; translate: 0 -50%; width: 18px; height: 18px;
    fill: none; stroke: var(--dim); stroke-width: 2; stroke-linecap: round; transition: stroke .2s; }
  input { width: 100%; height: 54px; padding: 0 22px 0 52px; border: 1px solid var(--border); border-radius: 27px;
    background: var(--field); color: var(--fg); font: inherit; outline: none;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    transition: border-color .2s, box-shadow .3s var(--ease), transform .3s var(--ease); }
  input:focus { border-color: var(--accent); transform: translateY(-1px);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent), 0 12px 40px rgba(0,0,0,.25); }
  form:focus-within svg { stroke: var(--accent); }
  p { margin: 0; color: var(--dim); font-size: 12.5px; }
  kbd { font: inherit; padding: 1px 6px; border: 1px solid var(--border); border-radius: 5px; }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Cederic<span>.</span></h1>
  <form id="f">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="Search the web" autocomplete="off" autofocus>
  </form>
  <p><kbd>Ctrl T</kbd> new tab &nbsp; <kbd>Ctrl L</kbd> address bar &nbsp; <kbd>Ctrl H</kbd> history &nbsp; <kbd>Alt P</kbd> picture-in-picture &nbsp; <kbd>F12</kbd> dev tools</p>
</main>
<script>
  // The browser resolves the query, so searches are saved to history like address-bar ones.
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = document.getElementById('q').value.trim();
    if (q) window.ipc.postMessage(JSON.stringify({ nt: 'search', input: q }));
  });
</script>
</body>
</html>
