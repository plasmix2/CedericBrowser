<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="dns-prefetch" href="https://search.brave.com">
<link rel="preconnect" href="https://search.brave.com" crossorigin>
<style>
  :root { --bg: #1d1e22; --fg: #ececf0; --dim: #8d909a; --field: #2a2b31; --border: #383a42; --accent: #ff6a3d;
    --ease: cubic-bezier(.2, .8, .2, 1); }
  :root[data-brand="uzaki"] { --bg: #181d2c; --fg: #eceff7; --dim: #8e98b4; --field: #232a3f; --border: #323c59; --accent: #7366e6; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f4f6; --fg: #1d1e22; --dim: #6b6f78; --field: #fff; --border: #d4d6dc; --accent: #ff6a3d; }
    :root[data-brand="uzaki"] { --bg: #edf0f7; --fg: #181d2c; --dim: #5b6580; --field: #fff; --border: #cbd3e6; --accent: #6a5acd; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 15px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; transition: background-color .2s, color .2s; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .55;
    background: radial-gradient(40% 35% at 30% 20%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 70%),
      radial-gradient(35% 30% at 75% 75%, rgba(120, 90, 255, .18), transparent 70%);
    animation: drift 18s ease-in-out infinite alternate;
    will-change: transform; transform: translateZ(0); }
  @keyframes drift { to { transform: translate(4%, -3%) scale(1.08); } }
  #bg { position: fixed; inset: 0; z-index: 0; background-size: cover; background-position: center; background-repeat: no-repeat;
    opacity: 0; transition: opacity .3s var(--ease); pointer-events: none;
    will-change: opacity; transform: translateZ(0); }
  #bg::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(10, 12, 18, .18) 0%, rgba(10, 12, 18, .54) 100%); }
  :root[data-has-bg="1"] #bg { opacity: 1; }
  :root[data-has-bg="1"] body::before { opacity: 0; }
  :root[data-has-bg="1"] h1 { color: #f6f7fb; text-shadow: 0 4px 24px rgba(0, 0, 0, .55); }
  :root[data-has-bg="1"] p { color: rgba(240, 242, 248, .85); text-shadow: 0 2px 10px rgba(0, 0, 0, .6); }
  :root[data-has-bg="1"] kbd { border-color: rgba(255, 255, 255, .28); background: rgba(15, 17, 24, .45); color: #f6f7fb; }
  :root[data-has-bg="1"] input,
  :root[data-has-bg="1"] .bm,
  :root[data-has-bg="1"] .top-pill { background: color-mix(in srgb, var(--field) 76%, transparent);
    backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25); }
  body.drag-over::after { content: "Drop image to set browser background"; position: fixed; inset: 14px; z-index: 10;
    border: 2px dashed var(--accent); border-radius: 18px; background: color-mix(in srgb, var(--bg) 72%, transparent);
    backdrop-filter: blur(8px); display: grid; place-items: center; color: var(--fg);
    font: 600 18px "Segoe UI Variable Display", "Segoe UI", system-ui; pointer-events: none; }
  #top-bar { position: fixed; top: 18px; right: 20px; z-index: 2; display: inline-flex; align-items: center; gap: 8px; }
  .top-pill { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 17px;
    border: 1px solid var(--border); background: var(--field); color: var(--dim);
    font: 12.5px "Segoe UI Variable Text", "Segoe UI", system-ui; cursor: pointer; user-select: none;
      radial-gradient(35% 30% at 75% 75%, rgba(120, 90, 255, .18), transparent 70%); }
  #theme-btn { position: fixed; top: 18px; right: 20px; z-index: 2; display: inline-flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--border); background: var(--field);
    color: var(--dim); font: 12.5px "Segoe UI Variable Text", "Segoe UI", system-ui; cursor: pointer;
    transition: border-color .2s, color .2s, transform .2s var(--ease); }
  .top-pill:hover { border-color: var(--accent); color: var(--fg); transform: translateY(-1px); }
  .top-pill svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  #bg-clear { display: none; width: 34px; padding: 0; justify-content: center; font-size: 16px; line-height: 1; }
  :root[data-has-bg="1"] #bg-clear { display: inline-flex; }
  #theme-btn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  main { position: relative; z-index: 1; min-height: 100%; display: grid; place-content: center; justify-items: center;
    gap: 24px; padding: 16px; text-align: center; }
  main > * { animation: rise .55s var(--ease) both; }
  main > :nth-child(2) { animation-delay: .06s; }
  main > :nth-child(3) { animation-delay: .10s; }
  main > :nth-child(4) { animation-delay: .14s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  .hero { display: inline-flex; align-items: center; gap: 14px; }
  #app-logo { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; display: none;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .28); border: 1.5px solid var(--border); }
  h1 { margin: 0; font: 650 48px "Segoe UI Variable Display", "Segoe UI", system-ui; letter-spacing: -1.5px; }
  h1 span { color: var(--accent); }
  form { position: relative; width: min(640px, calc(100vw - 32px)); }
  form svg { position: absolute; left: 20px; top: 50%; translate: 0 -50%; width: 18px; height: 18px;
    fill: none; stroke: var(--dim); stroke-width: 2; stroke-linecap: round; transition: stroke .2s; }
  input { width: 100%; height: 54px; padding: 0 22px 0 52px; border: 1px solid var(--border); border-radius: 27px;
    background: var(--field); color: var(--fg); font: inherit; outline: none;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    transition: border-color .2s, box-shadow .3s var(--ease), transform .3s var(--ease); }
  input:focus { border-color: var(--accent); transform: translateY(-1px);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent), 0 12px 40px rgba(0,0,0,.25); }
  form:focus-within svg { stroke: var(--accent); }
  #bms { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: min(680px, calc(100vw - 32px)); }
  #bms:empty { display: none; }
  .bm { display: inline-flex; align-items: center; gap: 8px; height: 36px; max-width: 200px; padding: 0 10px 0 13px;
    border-radius: 18px; border: 1px solid var(--border); background: var(--field); color: var(--fg);
    font-size: 13px; cursor: pointer; text-decoration: none; transition: border-color .18s, transform .18s var(--ease); }
  .bm:hover { border-color: var(--accent); transform: translateY(-1px); }
  .bm .star { color: var(--accent); font-size: 12px; flex: none; }
  .bm .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bm .del { width: 20px; height: 20px; border-radius: 50%; border: 0; background: none; color: var(--dim);
    display: grid; place-items: center; cursor: pointer; padding: 0; opacity: 0; transition: opacity .15s, background-color .15s, color .15s; }
  .bm:hover .del { opacity: .8; }
  .bm .del:hover { opacity: 1; color: var(--fg); background: rgba(128,128,128,.2); }
  p { margin: 0; color: var(--dim); font-size: 12.5px; }
  kbd { font: inherit; padding: 1px 6px; border: 1px solid var(--border); border-radius: 5px; }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="bg"></div>
<div id="top-bar">
  <label id="bg-btn" class="top-pill" for="bg-file" title="Choose a background image from your computer (or drag &amp; drop an image anywhere)">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-4.5-4.5a1.5 1.5 0 0 0-2.1 0L6 19"/></svg>
    <span id="bg-lbl">Background</span>
  </label>
  <input id="bg-file" type="file" accept="image/*" hidden>
  <button id="bg-clear" class="top-pill" type="button" title="Remove background image">×</button>
  <button id="theme-btn" class="top-pill" type="button" title="Switch between Cederic and Uzaki persona"><span class="dot"></span><span id="theme-lbl">Persona: Cederic</span></button>
</div>
<main>
  <div class="hero">
    <img id="app-logo" alt="Persona">
    <h1 id="brand"><b id="brand-name" style="font-weight:inherit">Cederic</b><span>.</span></h1>
  </div>
  <form id="f">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="Search the web" autocomplete="off">
  </form>
  <div id="bms"></div>
  <p><kbd>Ctrl T</kbd> new tab &nbsp; <kbd>Ctrl L</kbd> address bar &nbsp; <kbd>Ctrl D</kbd> bookmark &nbsp; <kbd>Ctrl B</kbd> bookmarks &nbsp; <kbd>Ctrl H</kbd> history &nbsp; <kbd>Alt P</kbd> PiP &nbsp; <kbd>F12</kbd> dev tools</p>
</main>
<script>
  const send = (o) => {
    const s = JSON.stringify(o);
    if (typeof window.__cedericSendIpc === 'function') window.__cedericSendIpc(s);
    else if (window.ipc) window.ipc.postMessage(s);
  };
  let curBrand = 'cederic';
  let curBg = '';

  const makeStripPng = (img) => {
    try {
      const sc = document.createElement('canvas');
      sc.width = 640; sc.height = 84;
      const sx = sc.getContext('2d');
      const iw = img.naturalWidth || img.width || 640;
      const ih = img.naturalHeight || img.height || 360;
      const scale = Math.max(sc.width / iw, sc.height / ih);
      const dw = iw * scale, dh = ih * scale;
      sx.filter = 'blur(3px)';
      sx.drawImage(img, (sc.width - dw) / 2, (sc.height - dh) * 0.2, dw, dh);
      return sc.toDataURL('image/png');
    } catch (_) {
      return '';
    }
  };

  const applyDataUrl = (rawUrl, keepRaw) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      let data = rawUrl;
      if (!keepRaw) {
        try {
          const maxW = 1920, maxH = 1080;
          let w = img.naturalWidth || 1920, h = img.naturalHeight || 1080;
          const r = Math.min(1, maxW / w, maxH / h);
          w = Math.max(1, Math.round(w * r));
          h = Math.max(1, Math.round(h * r));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          data = c.toDataURL('image/jpeg', 0.88);
        } catch (_) {}
      }
      const strip = makeStripPng(img);
      send({ nt: 'set_background', data, strip });
    };
    img.onerror = () => {
      if (rawUrl) send({ nt: 'set_background', data: rawUrl, strip: '' });
    };
    img.src = rawUrl;
  };

  const handleFile = (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    const keepGif = file.type === 'image/gif' && file.size <= 4 * 1024 * 1024;
    reader.onload = () => {
      if (typeof reader.result === 'string') applyDataUrl(reader.result, keepGif);
    };
    reader.readAsDataURL(file);
  };

  window.__cedericOpenBgPicker = () => document.getElementById('bg-file').click();
  window.__cedericApplyBgUrl = (url) => applyDataUrl(url, false);

  document.getElementById('bg-file').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) handleFile(f);
    e.target.value = '';
  });
  document.getElementById('bg-clear').addEventListener('click', () => {
    send({ nt: 'set_background', data: '', strip: '' });
  });
  window.addEventListener('dragover', (e) => {
    if (e.dataTransfer && [...e.dataTransfer.items].some((i) => i.kind === 'file')) {
      e.preventDefault();
      document.body.classList.add('drag-over');
    }
  });
  window.addEventListener('dragleave', (e) => {
    if (!e.relatedTarget || e.relatedTarget === document.documentElement) {
      document.body.classList.remove('drag-over');
    }
  });
  window.addEventListener('drop', (e) => {
    document.body.classList.remove('drag-over');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) {
      e.preventDefault();
      handleFile(f);
    }
  });
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = document.getElementById('q').value.trim();
    if (q) send({ nt: 'search', input: q });
  });
  document.getElementById('theme-btn').addEventListener('click', () => {
    send({ nt: 'set_brand', brand: curBrand === 'uzaki' ? 'cederic' : 'uzaki' });
  });
  window.renderNewTab = (s) => {
    curBrand = s.brand || 'cederic';
    document.documentElement.dataset.brand = curBrand;
    const brandTitle = curBrand === 'uzaki' ? 'Uzaki' : 'Cederic';
    document.getElementById('brand-name').textContent = brandTitle;
    document.getElementById('theme-lbl').textContent = curBrand === 'uzaki' ? 'Persona: Uzaki (Slate Blue)' : 'Persona: Cederic';
    if (s.logo) {
      const logoEl = document.getElementById('app-logo');
      if (!logoEl.src) logoEl.src = s.logo;
      logoEl.style.display = 'block';
    }
    const bg = s.background || '';
    if (bg !== curBg) {
      curBg = bg;
      const bgEl = document.getElementById('bg');
      bgEl.style.backgroundImage = bg ? `url(${JSON.stringify(bg)})` : '';
    }
    document.getElementById('bg-btn').title = `Choose a ${brandTitle} background image from your computer (or drag & drop an image anywhere)`;
    document.getElementById('bg-clear').title = `Remove ${brandTitle} background image`;
    if (bg) {
      document.documentElement.dataset.hasBg = '1';
      document.getElementById('bg-lbl').textContent = `Change ${brandTitle} Background`;
    } else {
      delete document.documentElement.dataset.hasBg;
      document.getElementById('bg-lbl').textContent = `${brandTitle} Background`;
    }
    const box = document.getElementById('bms');
    box.textContent = '';
    const frag = document.createDocumentFragment();
    for (const b of (s.bookmarks || [])) {
      if (window.__cedericPreconnect) window.__cedericPreconnect(b.url);
      const el = document.createElement('div');
      el.className = 'bm';
      el.title = b.url;
      const star = document.createElement('span');
      star.className = 'star';
      star.textContent = '★';
      const lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.textContent = b.title || b.url;
      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.title = 'Remove bookmark';
      del.textContent = '×';
      del.onclick = (e) => { e.stopPropagation(); send({ nt: 'delete_bookmark', url: b.url }); };
      el.onclick = () => send({ nt: 'open_bookmark', url: b.url });
      el.append(star, lbl, del);
      frag.append(el);
    }
    box.append(frag);
  };
  send({ nt: 'ready' });
</script>
</body>
</html>
