<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  :root { --bg: #1d1e22; --fg: #ececf0; --dim: #8d909a; --field: #2a2b31; --border: #383a42; --accent: #ff6a3d;
    --ease: cubic-bezier(.2, .8, .2, 1); }
  :root[data-brand="uzaki"] { --bg: #181d2c; --fg: #eceff7; --dim: #8e98b4; --field: #232a3f; --border: #323c59; --accent: #7366e6; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f4f6; --fg: #1d1e22; --dim: #6b6f78; --field: #fff; --border: #d4d6dc; --accent: #ff6a3d; }
    :root[data-brand="uzaki"] { --bg: #edf0f7; --fg: #181d2c; --dim: #5b6580; --field: #fff; --border: #cbd3e6; --accent: #6a5acd; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 15px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; transition: background-color .2s, color .2s; }
  body::before { content: ""; position: fixed; inset: -20%; pointer-events: none; opacity: .55;
    background: radial-gradient(40% 35% at 30% 20%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 70%),
      radial-gradient(35% 30% at 75% 75%, rgba(120, 90, 255, .18), transparent 70%);
    animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(4%, -3%) scale(1.08); } }
  #theme-btn { position: fixed; top: 18px; right: 20px; z-index: 2; display: inline-flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--border); background: var(--field);
    color: var(--dim); font: 12.5px "Segoe UI Variable Text", "Segoe UI", system-ui; cursor: pointer;
    transition: border-color .2s, color .2s, transform .2s var(--ease); }
  #theme-btn:hover { border-color: var(--accent); color: var(--fg); transform: translateY(-1px); }
  #theme-btn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  main { position: relative; min-height: 100%; display: grid; place-content: center; justify-items: center;
    gap: 24px; padding: 16px; text-align: center; }
  main > * { animation: rise .55s var(--ease) both; }
  main > :nth-child(2) { animation-delay: .06s; }
  main > :nth-child(3) { animation-delay: .10s; }
  main > :nth-child(4) { animation-delay: .14s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  h1 { margin: 0; font: 650 48px "Segoe UI Variable Display", "Segoe UI", system-ui; letter-spacing: -1.5px; }
  h1 span { color: var(--accent); }
  form { position: relative; width: min(640px, calc(100vw - 32px)); }
  form svg { position: absolute; left: 20px; top: 50%; translate: 0 -50%; width: 18px; height: 18px;
    fill: none; stroke: var(--dim); stroke-width: 2; stroke-linecap: round; transition: stroke .2s; }
  input { width: 100%; height: 54px; padding: 0 22px 0 52px; border: 1px solid var(--border); border-radius: 27px;
    background: var(--field); color: var(--fg); font: inherit; outline: none;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    transition: border-color .2s, box-shadow .3s var(--ease), transform .3s var(--ease); }
  input:focus { border-color: var(--accent); transform: translateY(-1px);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent), 0 12px 40px rgba(0,0,0,.25); }
  form:focus-within svg { stroke: var(--accent); }
  #bms { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: min(680px, calc(100vw - 32px)); }
  #bms:empty { display: none; }
  .bm { display: inline-flex; align-items: center; gap: 8px; height: 36px; max-width: 200px; padding: 0 10px 0 13px;
    border-radius: 18px; border: 1px solid var(--border); background: var(--field); color: var(--fg);
    font-size: 13px; cursor: pointer; text-decoration: none; transition: border-color .18s, transform .18s var(--ease); }
  .bm:hover { border-color: var(--accent); transform: translateY(-1px); }
  .bm .star { color: var(--accent); font-size: 12px; flex: none; }
  .bm .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bm .del { width: 20px; height: 20px; border-radius: 50%; border: 0; background: none; color: var(--dim);
    display: grid; place-items: center; cursor: pointer; padding: 0; opacity: 0; transition: opacity .15s, background-color .15s, color .15s; }
  .bm:hover .del { opacity: .8; }
  .bm .del:hover { opacity: 1; color: var(--fg); background: rgba(128,128,128,.2); }
  p { margin: 0; color: var(--dim); font-size: 12.5px; }
  kbd { font: inherit; padding: 1px 6px; border: 1px solid var(--border); border-radius: 5px; }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<button id="theme-btn" type="button" title="Switch between Cederic and Uzaki theme"><span class="dot"></span><span id="theme-lbl">Theme: Cederic</span></button>
<main>
  <h1 id="brand"><b id="brand-name" style="font-weight:inherit">Cederic</b><span>.</span></h1>
  <form id="f">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="Search the web" autocomplete="off">
  </form>
  <div id="bms"></div>
  <p><kbd>Ctrl T</kbd> new tab &nbsp; <kbd>Ctrl L</kbd> address bar &nbsp; <kbd>Ctrl D</kbd> bookmark &nbsp; <kbd>Ctrl B</kbd> bookmarks &nbsp; <kbd>Ctrl H</kbd> history &nbsp; <kbd>Alt P</kbd> PiP &nbsp; <kbd>F12</kbd> dev tools</p>
</main>
<script>
  const send = (o) => window.ipc.postMessage(JSON.stringify(o));
  let curBrand = 'cederic';
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = document.getElementById('q').value.trim();
    if (q) send({ nt: 'search', input: q });
  });
  document.getElementById('theme-btn').addEventListener('click', () => {
    send({ nt: 'set_brand', brand: curBrand === 'uzaki' ? 'cederic' : 'uzaki' });
  });
  window.renderNewTab = (s) => {
    curBrand = s.brand || 'cederic';
    document.documentElement.dataset.brand = curBrand;
    const name = curBrand === 'uzaki' ? 'Uzaki' : 'Cederic';
    document.getElementById('brand-name').textContent = name;
    document.getElementById('theme-lbl').textContent = curBrand === 'uzaki' ? 'Theme: Uzaki (Slate Blue)' : 'Theme: Cederic';
    const box = document.getElementById('bms');
    box.textContent = '';
    for (const b of (s.bookmarks || [])) {
      const el = document.createElement('div');
      el.className = 'bm';
      el.title = b.url;
      const star = document.createElement('span');
      star.className = 'star';
      star.textContent = '★';
      const lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.textContent = b.title || b.url;
      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.title = 'Remove bookmark';
      del.textContent = '×';
      del.onclick = (e) => { e.stopPropagation(); send({ nt: 'delete_bookmark', url: b.url }); };
      el.onclick = () => send({ nt: 'open_bookmark', url: b.url });
      el.append(star, lbl, del);
      box.append(el);
    }
  };
  send({ nt: 'ready' });
</script>
</body>
</html>
