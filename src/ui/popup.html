<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --card: #2b2c32; --fg: #ececf0; --dim: #9a9ca6; --hover: rgba(255,255,255,.08); --sel: rgba(255,106,61,.16);
    --border: rgba(255,255,255,.08); --accent: #ff6a3d; --ease: cubic-bezier(.2, .8, .2, 1);
  }
  @media (prefers-color-scheme: light) {
    :root { --card: #ffffff; --fg: #1d1e22; --dim: #6b6f78; --hover: rgba(0,0,0,.055); --sel: rgba(255,106,61,.13);
      --border: rgba(0,0,0,.1); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--card); overflow: hidden; user-select: none; color: var(--fg);
    font: 13px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round; flex: none; }
  #card { position: absolute; inset: 0; padding: 5px; opacity: 0; transform: translateY(-3px); }
  #card.show { opacity: 1; transform: none; transition: opacity .12s var(--ease), transform .18s var(--ease); }
  .row { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border-radius: 7px; cursor: default;
    transition: background-color .08s; white-space: nowrap; }
  .row:hover:not(.disabled), .row.sel { background: var(--hover); }
  .row.disabled { color: var(--dim); opacity: .55; }
  .row .label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row .hint { color: var(--dim); font-size: 11.5px; }
  .sep { height: 1px; margin: 4px 6px; background: var(--border); }
  .suggest .row { height: 36px; padding: 0 12px; gap: 12px; font-size: 13.5px; border-radius: 9px; }
  .suggest .row svg { color: var(--dim); }
  .suggest .row.sel { background: var(--sel); }
  .suggest .row.sel svg { color: var(--accent); }
  .suggest .row b { font-weight: 600; }
  .suggest .row .hint { opacity: 0; transition: opacity .1s; }
  .suggest .row.sel .hint, .suggest .row:hover .hint { opacity: 1; }
  #card.preview { padding: 0; display: flex; flex-direction: column; }
  .preview .shot { height: 158px; flex: none; background: #000 center / cover no-repeat;
    border-bottom: 1px solid var(--border); }
  .preview .text { padding: 11px 14px 0; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .preview .title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview .host { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview .host svg { width: 12px; height: 12px; }
</style>
</head>
<body>
<div id="card"></div>
<script>
  const card = document.getElementById('card');
  const send = (o) => window.ipc.postMessage(JSON.stringify(o));
  const ICONS = {
    search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
    url: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  };
  let rows = [], sel = -1, kind = '';

  // Hover card for a tab. Moving between tabs only swaps the content, without replaying the fade.
  window.showPreview = (p) => {
    const wasOpen = kind === 'preview' && card.classList.contains('show');
    kind = 'preview'; rows = [];
    card.textContent = '';
    if (p.img) {
      const shot = document.createElement('div');
      shot.className = 'shot';
      shot.style.backgroundImage = `url("${p.img}")`;
      card.append(shot);
    }
    const text = document.createElement('div'); text.className = 'text';
    const title = document.createElement('div'); title.className = 'title'; title.textContent = p.title;
    const host = document.createElement('div'); host.className = 'host';
    host.innerHTML = ICONS.url;
    host.append(p.host || 'New tab');
    text.append(title, host);
    card.append(text);
    if (wasOpen) card.className = 'preview show'; else animateIn('preview');
  };

  function animateIn(cls) {
    card.className = cls;
    card.offsetWidth;
    card.classList.add('show');
  }

  function row(label, hint, disabled) {
    const r = document.createElement('div');
    r.className = 'row' + (disabled ? ' disabled' : '');
    const l = document.createElement('span'); l.className = 'label'; l.textContent = label;
    r.append(l);
    if (hint) { const h = document.createElement('span'); h.className = 'hint'; h.textContent = hint; r.append(h); }
    return r;
  }

  window.showMenu = (items) => {
    kind = 'menu'; sel = -1; rows = [];
    card.textContent = '';
    items.forEach((it, i) => {
      if (it.sep) { const s = document.createElement('div'); s.className = 'sep'; card.append(s); return; }
      const r = row(it.label, it.hint, it.disabled);
      r.dataset.index = i;
      if (!it.disabled) {
        r.onmouseup = () => send({ cmd: 'pick', index: i });
        r.onmouseenter = () => setSel(rows.indexOf(r));
        rows.push(r);
      }
      card.append(r);
    });
    animateIn('menu');
  };

  // The typed query is bolded inside each suggestion, like most browsers do.
  window.showSuggest = (items) => {
    const wasOpen = kind === 'suggest' && card.classList.contains('show');
    kind = 'suggest'; rows = [];
    card.textContent = '';
    const q = items.length ? items[0].text.toLowerCase() : '';
    items.forEach((it, i) => {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = it.kind === 'url' ? ICONS.url : ICONS.search;
      const l = document.createElement('span'); l.className = 'label';
      const lower = it.text.toLowerCase();
      if (it.kind === 'suggest' && q && lower.startsWith(q)) {
        l.append(it.text.slice(0, q.length));
        const b = document.createElement('b'); b.textContent = it.text.slice(q.length); l.append(b);
      } else l.textContent = it.text;
      const h = document.createElement('span'); h.className = 'hint';
      h.textContent = it.kind === 'url' ? 'Open site' : 'Search';
      r.append(l, h);
      // mousedown, not click: the address bar loses focus on mouseup.
      r.onmousedown = (e) => { e.preventDefault(); send({ cmd: 'pick', index: i }); };
      rows.push(r);
      card.append(r);
    });
    sel = 0;
    if (rows[0]) rows[0].classList.add('sel');
    if (wasOpen) card.className = 'suggest show'; else animateIn('suggest');
  };

  function setSel(i) {
    if (rows[sel]) rows[sel].classList.remove('sel');
    sel = i;
    if (rows[sel]) rows[sel].classList.add('sel');
  }
  window.select = (i) => setSel(i);

  window.hideAll = () => { card.className = ''; kind = ''; rows = []; card.textContent = ''; };

  window.addEventListener('keydown', (e) => {
    if (kind !== 'menu') return;
    if (e.key === 'Escape') { e.preventDefault(); send({ cmd: 'close' }); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const n = rows.length; if (!n) return;
      setSel(e.key === 'ArrowDown' ? (sel + 1) % n : (sel - 1 + n) % n);
    } else if (e.key === 'Enter' && rows[sel]) {
      e.preventDefault(); send({ cmd: 'pick', index: Number(rows[sel].dataset.index) });
    }
  });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
</body>
</html>
