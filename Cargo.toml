[package]
name = "persona"
version = "0.2.0"
edition = "2024"
description = "A lean, memory-safe browser shell written in Rust"
default-run = "Persona"

[[bin]]
name = "Persona"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
cosmic-text = "0.19.0"
ico = "0.6.0"
jpeg-decoder = { version = "0.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
softbuffer = "0.4.8"
tao = "0.37.2"
tiny-skia = "0.12.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.1", default-features = false, features = ["native-tls"] }
url = "2.5.8"
wry = { version = "0.57.1", features = ["devtools"] }

# Servo engine (optional, `--features servo`): a long first build. See docs/ENGINE_2_0_PLAN.md.
servo = { version = "0.7.0", default-features = false, features = ["bundled", "js_jit", "no-wgl"], optional = true }
dpi = { version = "0.1", optional = true }
euclid = { version = "0.22", optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"], optional = true }

[features]
servo = ["dep:servo", "dep:dpi", "dep:euclid", "dep:rustls"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
