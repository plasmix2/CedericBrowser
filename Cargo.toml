[package]
name = "persona"
version = "2.0.0"
edition = "2024"
description = "A lean, memory-safe browser shell written in Rust"
default-run = "Persona"

[[bin]]
name = "Persona"
path = "src/main.rs"

[dependencies]
anvil_ui = { path = "vendor/anvil/crates/anvil_ui" }
arboard = { version = "3.7.0", default-features = false }
glam = "0.27"
ico = "0.6.0"
jpeg-decoder = { version = "0.3", default-features = false }
rfd = { version = "0.15", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
softbuffer = "0.4.8"
tao = "0.37.2"
tiny-skia = "0.12.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.1", default-features = false, features = ["native-tls"] }
url = "2.5.8"
wry = { version = "0.57.1", features = ["devtools"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
