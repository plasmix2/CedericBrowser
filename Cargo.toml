[package]
name = "cederic"
version = "0.1.0"
edition = "2024"
description = "A lean, memory-safe browser shell written in Rust"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
cosmic-text = "0.19.0"
ico = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
softbuffer = "0.4.8"
tao = "0.37.2"
tiny-skia = "0.12.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.1", default-features = false, features = ["native-tls"] }
url = "2.5.8"
wry = { version = "0.57.1", features = ["devtools"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
