# Builds and tests Persona on Windows for every push and pull request. Uploads the exe and the
# ANVL render screenshots (toolbar, popups, dialogs, drawn on Windows' software GPU) as workflow
# artifacts: Actions tab -> the run -> Artifacts. It never creates a release or a tag, so installed
# copies do not auto-update from it (release.yml does that).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: -D warnings

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      # The headless ANVL renders need a GPU adapter; GitHub's Windows runners provide WARP (DX12).
      # One thread: each test shares one GPU engine, and parallel devices have crashed WARP.
      - name: Render the native UI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:CEDERIC_SHOT = "$PWD\shots"
          cargo test --release render_ -- --ignored --test-threads=1

      - name: Name the exe after the commit
        shell: pwsh
        run: Copy-Item target\release\Persona.exe "Persona-${env:GITHUB_SHA}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Persona-${{ github.sha }}
          path: Persona-${{ github.sha }}.exe
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-renders-${{ github.sha }}
          path: shots/*.png
          retention-days: 14
