# Builds and tests Persona on Windows for every push and pull request, and uploads the exe as a
# workflow artifact (Actions tab -> the run -> Artifacts). It never creates a release or a tag,
# so installed copies do not auto-update from it (see release.yml for that).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: -D warnings

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Name the exe after the commit
        shell: pwsh
        run: Copy-Item target\release\Persona.exe "Persona-${env:GITHUB_SHA}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Persona-${{ github.sha }}
          path: Persona-${{ github.sha }}.exe
          retention-days: 14

  # Experimental Persona 2.0 build on the Servo engine. Long first build (SpiderMonkey, Stylo);
  # later runs reuse the cache. Run it with PERSONA_ENGINE unset; PERSONA_ENGINE=webview2 falls back.
  windows-servo:
    runs-on: windows-latest
    env:
      RUSTFLAGS: ""
      LIBCLANG_PATH: C:\Program Files\LLVM\lib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: servo

      - name: Build (Servo)
        run: cargo build --release --features servo

      - name: Name the exe after the commit
        shell: pwsh
        run: Copy-Item target\release\Persona.exe "Persona-Servo-${env:GITHUB_SHA}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Persona-Servo-${{ github.sha }}
          path: Persona-Servo-${{ github.sha }}.exe
          retention-days: 14
