# Builds Persona for Windows and publishes it as a GitHub release when a version tag is pushed:
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# The tag must match `version` in Cargo.toml. Tags with a suffix (v0.3.1-beta.1) become
# pre-releases. Installed copies of Persona pick the new release up automatically (src/update.rs).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "${GITHUB_REF_NAME%%-*}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Name the exe after the release
        shell: pwsh
        run: Copy-Item target\release\Persona.exe "Persona-${env:GITHUB_REF_NAME}.exe"

      - uses: softprops/action-gh-release@v2
        with:
          name: Persona ${{ github.ref_name }}
          files: Persona-${{ github.ref_name }}.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
