# Builds Persona for Windows and publishes it as a GitHub release when a version tag is pushed:
#
#   git tag v2.0.0 && git push origin v2.0.0        -> release "Persona V2.0.0"
#   git tag v2.0.0-pre && git push origin v2.0.0-pre -> the same, as a pre-release
#
# The tag must match `version` in Cargo.toml; anything after a '-' marks a pre-release.
# It can also be run from the Actions tab ("Run workflow") with the tag to create, which needs no
# tag push: the release step creates the tag on the commit that was built. Installed copies of Persona pick the new release up automatically (src/update.rs).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.0 or v0.2.0-pre (must match Cargo.toml)"
        required: true

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "${TAG%%-*}" ]; then
            echo "Tag ${TAG} does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Name the exe after the release
        shell: pwsh
        run: Copy-Item target\release\Persona.exe "Persona-${env:TAG}.exe"

      - uses: softprops/action-gh-release@v2
        with:
          name: Persona V${{ steps.version.outputs.version }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: Persona-${{ env.TAG }}.exe
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
