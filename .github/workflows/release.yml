# Builds Persona for Windows and publishes it as a GitHub release when a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0        -> release "Persona V0.2.0"
#   git tag v0.2.0-pre && git push origin v0.2.0-pre -> the same, as a pre-release
#
# The tag must match `version` in Cargo.toml; anything after a '-' marks a pre-release. Installed copies of Persona pick the new release up automatically (src/update.rs).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "${GITHUB_REF_NAME%%-*}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Name the exe after the release
        shell: pwsh
        run: Copy-Item target\release\Persona.exe "Persona-${env:GITHUB_REF_NAME}.exe"

      - uses: softprops/action-gh-release@v2
        with:
          name: Persona V${{ steps.version.outputs.version }}
          files: Persona-${{ github.ref_name }}.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
